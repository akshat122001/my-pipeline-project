name: CI/CD Pipeline
on:
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Create target directory
      run: mkdir cloned_content
      
    - name: Copy files safely
      run: |
        $files = Get-ChildItem -Path . -Exclude @('.github', 'cloned_content')
        foreach ($file in $files) {
          Copy-Item -Path $file.FullName -Destination "cloned_content\" -Recurse -Force
        }
        
    - name: Verify copy
      run: dir cloned_content